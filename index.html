<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instrução de Trabalho</title>
<meta name="theme-color" content="#163B44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: assistente de 7 passos em coluna única para celular; cabeçalho azul da logo com a faixa
   em degradê da instrução de trabalho; barra fixa embaixo com Voltar / Avançar. */
:root{
  --azul:#163B44; --azul-2:#2D5A66; --barra:#C3D7DC; --tinta:#1B2A30; --cinza:#5E6E75;
  --fundo:#F3F5F6; --cartao:#FFFFFF; --quadro:#EDF0F2; --linha:#D3DADE;
  --ok:#2E8B57; --alerta:#C62828; --alerta-bg:#FDECEC; --seg-bg:#FFF6D8; --seg:#8A6100;
  --epi-bg:#EAF2FC; --epi:#1F63B5; --topo:#163B44; --topo-tx:#FFFFFF; --topo-sub:#B9CCD2;
  --acao:#163B44; --acao-tx:#FFFFFF; --sombra:0 1px 2px rgba(22,59,68,.08);
  --fonte:Arial,"Helvetica Neue",Helvetica,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --azul:#9CC7D1; --azul-2:#6FA0AB; --barra:#24424A; --tinta:#E6EDEF; --cinza:#9DB0B6;
  --fundo:#0F1B1F; --cartao:#17272C; --quadro:#1E3238; --linha:#2F474E;
  --ok:#5FC58F; --alerta:#FF8A80; --alerta-bg:#3A1F1F; --seg-bg:#3A3215; --seg:#F2C94C;
  --epi-bg:#172C45; --epi:#8DBBF2; --topo:#0B2A32; --topo-tx:#FFFFFF; --topo-sub:#B9CCD2;
  --acao:#3F8FA1; --acao-tx:#06171B; --sombra:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --azul:#9CC7D1; --azul-2:#6FA0AB; --barra:#24424A; --tinta:#E6EDEF; --cinza:#9DB0B6;
  --fundo:#0F1B1F; --cartao:#17272C; --quadro:#1E3238; --linha:#2F474E;
  --ok:#5FC58F; --alerta:#FF8A80; --alerta-bg:#3A1F1F; --seg-bg:#3A3215; --seg:#F2C94C;
  --epi-bg:#172C45; --epi:#8DBBF2; --topo:#0B2A32; --topo-tx:#FFFFFF; --topo-sub:#B9CCD2;
  --acao:#3F8FA1; --acao-tx:#06171B; --sombra:none; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--fundo);color:var(--tinta);font-family:var(--fonte);font-size:16px;line-height:1.4;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.topo{background:var(--topo);color:var(--topo-tx)}
.topo-in{max-width:720px;margin:0 auto;padding-block:6px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.topo h1{font-size:16px;margin:0;line-height:1.15}
.topo p{margin:0;font-size:12px;color:var(--topo-sub)}
.topo .tit{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.topo button{background:transparent;border:1px solid var(--azul-2);color:var(--topo-tx);border-radius:8px;padding:5px 10px;font-size:13px;min-height:34px}
.faixa{height:3px;background:linear-gradient(90deg,#DA3634,#D47034 55%,#ECA73F)}
.passos{background:var(--cartao);border-bottom:1px solid var(--linha);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--topo)}
.passos-in{max-width:720px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.passos-in::-webkit-scrollbar{display:none}
.passo{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--quadro);color:var(--cinza);border-radius:999px;padding:4px 11px 4px 5px;font-size:13px;min-height:32px}
.passo b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--linha);color:var(--tinta);font-size:12px}
.passo[aria-current="step"]{background:var(--acao);border-color:var(--acao);color:var(--acao-tx);font-weight:bold}
.passo[aria-current="step"] b{background:var(--acao-tx);color:var(--acao)}
main{max-width:720px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:19px;margin:0;color:var(--azul);text-wrap:balance}
.dica{color:var(--cinza);font-size:13.5px;margin:0}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra);min-width:0}
.cartao h3{margin:0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--azul)}
.cartao.seg{background:var(--seg-bg);border-left:4px solid #E3A400}
.cartao.seg h3{color:var(--seg)}
.cartao.epi{background:var(--epi-bg);border-left:4px solid var(--epi)}
.cartao.epi h3{color:var(--epi)}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold;color:var(--cinza);min-width:0}
label.campo span.r{display:flex;justify-content:space-between;gap:8px}
label.campo small{font-weight:normal}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--linha);background:var(--cartao);border-radius:8px;padding:11px 12px;font-size:16px;font-weight:normal;color:var(--tinta);min-height:46px}
textarea{resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.tipo:focus-visible{outline:3px solid var(--epi);outline-offset:1px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tres{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}
@media (max-width:430px){.tres{grid-template-columns:1fr 1fr}.tres>:last-child{grid-column:1/-1}}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tipo{border:1px solid var(--linha);background:var(--cartao);border-radius:10px;padding:10px 12px;text-align:left;min-height:52px;display:flex;flex-direction:column;gap:2px}
.tipo small{color:var(--cinza);font-size:11px;letter-spacing:.05em}
.tipo[aria-pressed="true"]{background:var(--acao);border-color:var(--acao);color:var(--acao-tx);font-weight:bold}
.tipo[aria-pressed="true"] small{color:inherit;opacity:.8}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cond .tipo{align-items:flex-start}
.btn{border:1px solid var(--acao);background:var(--acao);color:var(--acao-tx);border-radius:10px;padding:12px 16px;font-weight:bold;min-height:48px}
.btn.sec{background:transparent;color:var(--azul);border-color:var(--linha)}
.btn.leve{background:var(--quadro);color:var(--tinta);border-color:var(--linha);font-weight:normal}
.btn.perigo{background:transparent;color:var(--alerta);border-color:var(--alerta)}
.btn:disabled{opacity:.5}
.linha-item{display:flex;gap:8px;align-items:center}
.linha-item input{flex:1;min-width:0}
.x{flex:none;width:44px;height:44px;border-radius:8px;border:1px solid var(--linha);background:var(--cartao);color:var(--alerta);font-size:20px;line-height:1}
.bloco{border:1px solid var(--linha);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--cartao);min-width:0}
.bloco-cab{display:flex;align-items:center;gap:8px}
.bloco-cab strong{flex:1;color:var(--azul)}
.num{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--acao);color:var(--acao-tx);font-weight:bold;font-size:14px}
.mini{width:40px;height:40px;border-radius:8px;border:1px solid var(--linha);background:var(--cartao);font-size:16px}
.foto{display:flex;gap:10px;align-items:center;min-width:0}
.foto .th{flex:none;width:96px;height:72px;border-radius:8px;background:#E4E9EB;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#5E6E75;font-size:11px;text-align:center;border:1px dashed #93A3AA}
.foto .th.tem{border-style:solid;border-color:var(--linha)}
.foto .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.foto .ac{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.foto label.btn{display:inline-flex;align-items:center;cursor:pointer;padding:10px 14px;min-height:44px}
.foto input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.epis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.epi-op{border:1px solid var(--linha);background:var(--cartao);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;align-items:stretch}
.epi-op img{width:100%;height:74px;object-fit:contain;background:#fff;border-radius:6px}
.epi-op span{font-size:13px;font-weight:bold;line-height:1.2}
.epi-op small{font-size:11px;color:var(--cinza)}
.epi-op[aria-pressed="true"]{border-color:var(--epi);box-shadow:0 0 0 2px var(--epi) inset}
.par{display:flex;gap:8px;flex-wrap:wrap}.par>.btn{flex:1 1 140px}
.gal{position:fixed;inset:0;z-index:60;background:var(--fundo);display:flex;flex-direction:column}
.gal[hidden]{display:none}
.gal-topo{background:var(--cartao);border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.gal-l1{display:flex;gap:8px;align-items:center}.gal-l1 strong{flex:1;font-size:17px;color:var(--azul)}
.gal-topo input[type=search]{width:100%;border:1px solid var(--linha);background:var(--cartao);border-radius:8px;padding:9px 12px;font-size:16px;color:var(--tinta);min-height:44px}
.gal-abas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.gal-abas::-webkit-scrollbar{display:none}
.gal-abas button{flex:none;border:1px solid var(--linha);border-radius:999px;padding:7px 13px;background:var(--cartao);color:var(--tinta);font-size:13.5px}
.gal-abas button[aria-pressed="true"]{background:var(--acao);border-color:var(--acao);color:var(--acao-tx);font-weight:bold}
.gal-corpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px))}
.gal-corpo h4{margin:16px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza)}.gal-corpo h4:first-child{margin-top:2px}
.gal-grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:640px){.gal-grade{grid-template-columns:repeat(5,minmax(0,1fr))}}
.gal-it{position:relative;border:1px solid var(--linha);background:var(--cartao);border-radius:10px;padding:5px 5px 7px;display:flex;flex-direction:column;gap:5px;color:var(--tinta);min-width:0;font:inherit}
.gal-it img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:7px;display:block}
.gal-it span{font-size:12px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.gal-it small{font-size:10.5px;color:var(--cinza);text-align:center}
.gal-it[aria-pressed="true"]{border-color:var(--epi);box-shadow:0 0 0 2px var(--epi) inset}
.gal-it[aria-pressed="true"]::after{content:"\2713";position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:var(--epi);color:#fff;font-size:15px;line-height:24px;text-align:center;font-weight:bold}
.gal-it:disabled{opacity:.45}
.gal-rodape{background:var(--cartao);border-top:1px solid var(--linha);display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px))}
.gal-rodape .btn{flex:1}.gal-rodape .btn.sec{flex:0 0 auto}
.gal-vazio{padding:30px 10px;text-align:center;color:var(--cinza)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
.check input{width:22px;height:22px;flex:none}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--cartao);border-top:1px solid var(--linha);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.rodape-in{max-width:720px;margin:0 auto;display:flex;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rodape .btn{flex:1}
.doc{font-family:"Courier New",monospace;font-weight:bold;font-size:17px;color:var(--azul);overflow-wrap:anywhere}
.lista{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.aviso{border-radius:10px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.aviso.erro{background:var(--alerta-bg);border:1px solid var(--alerta);color:var(--tinta)}
.aviso.erro strong{color:var(--alerta)}
.aviso.ok{background:var(--quadro);border:1px solid var(--ok)}
.aviso.ok strong{color:var(--ok)}
.aviso.info{background:var(--quadro);border:1px solid var(--linha)}
.previa{border:1px solid var(--linha);border-radius:10px;background:#fff;overflow-x:auto;max-width:100%}
.previa svg{display:block;width:100%;height:auto}
.paginas{display:flex;flex-direction:column;gap:8px;min-width:0}
.paginas .dica{margin-top:4px}
.zoom .previa svg{width:1180px;max-width:none}
.tipo small.desc{letter-spacing:0;font-size:12px;line-height:1.3}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.acoes .btn{flex:1 1 150px}
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1B2A30;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
details summary{cursor:pointer;font-size:14px;color:var(--cinza);min-height:36px}
@media (prefers-reduced-motion:no-preference){.passo,.tipo,.btn{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <div class="tit"><h1>Instrução de Trabalho</h1><p>Coleta e geração</p></div>
    <button type="button" id="btExemplo">Exemplo</button>
    <button type="button" id="btNova">Nova</button>
  </div>
  <div class="faixa"></div>
</header>
<nav class="passos" aria-label="Passos"><div class="passos-in" id="passos"></div></nav>
<main id="tela"></main>
<div class="rodape"><div class="rodape-in">
  <button type="button" class="btn sec" id="btVoltar">Voltar</button>
  <button type="button" class="btn" id="btAvancar">Avançar</button>
</div></div>
<div class="msg" id="msg" hidden role="status"></div>

          const v = Math.max(largura(pal.slice(0, q).join(" "), 6.5, "bold"), largura(pal.slice(q).join(" "), 6.5, "bold"));
          if (v < melhor) { melhor = v; k = q; }
        }
        linhasN = [pal.slice(0, k).join(" "), pal.slice(k).join(" ")];
        ntam = Math.min(...linhasN.map(l => ajustar(l, 6.5, nw, 5.5, "bold")));
      } else if (largura(nome, ntam, "bold") > nw) ntam = ajustar(nome, ntam, nw, 5.5, "bold");
      if (ntam < 6 || linhasN.some(l => largura(l, ntam, "bold") > nw))
        aviso("EPIs: muitos EPIs no quadro; os EPIs da área já aparecem no rodapé e não precisam ser repetidos.");
      linhasN = linhasN.map(l => encurtar(l, ntam, nw, "bold"));
      if (linhasN.length === 1) pg.texto(nx, cy + (sub ? 1 : -2.5), linhasN[0], ntam, TINTA, "bold");
      else pg.paragrafo(nx, cy + (sub ? 4 : 1.5), linhasN, ntam, TINTA, "bold", null, nw, ntam * 1.08);
    }
    if (sub && erh >= 15) {
      const dois = linhasN.length === 2, oy = dois ? cy + 4 - ntam * 1.08 - 6.3 : cy - 7;
      let stam = ajustar(sub, dois ? 5.5 : 6, nw, 5);
      if (largura(sub, stam) > nw) sub = "SAP " + e.codigo;
      if (largura(sub, stam) > nw) stam = ajustar(sub, stam, nw, 4.5);
      pg.texto(nx, oy, sub, stam, CINZA);
    }
  });
  // ferramentas e materiais
  x = M + sw + ew + 15;
  pg.caixa(x, y - bh, tw, bh, 6, FUNDO, LINHA, 0.75);
  pg.texto(x + 10, y - 12, "FERRAMENTAS E MATERIAIS", 7.1, AZUL, "bold");
  const nI = Math.max(1, itens.length), gx0 = x + 6, gy0 = y - 17, gw0 = tw - 12, gh0 = bh - 22;
  let linI = nI <= 3 ? 1 : 2, colsI = Math.ceil(nI / linI);
  if (gw0 / colsI < 85) { linI = 3; colsI = Math.ceil(nI / 3); }
  if (gw0 / colsI < 70) aviso("Ferramentas e materiais: muitos itens; agrupe os consumíveis (ex.: kit de limpeza).");
  const icw = gw0 / colsI, ich = gh0 / linI;
  itens.forEach((it, i) => {
    const r_ = Math.floor(i / colsI), c_ = i % colsI, cx_ = gx0 + c_ * icw, cy_ = gy0 - r_ * ich;
    pg.caixa(cx_ + 2, cy_ - ich + 2, icw - 4, ich - 4, 4.5, "white");
    const th = ich - 10, tw_ = Math.min(th * 1.35, icw * 0.32);
    if (it.foto) pg.foto(it.foto, cx_ + 6, cy_ - ich + 5, tw_, th, "ajustar", 3);
    else pg.foto(null, cx_ + 6, cy_ - ich + 5, tw_, th, null, 3);
    const nx = cx_ + 6 + tw_ + 6, nw = icw - tw_ - 16, nome = it.nome, temCod = !vazio(it.codigo), linhaCod = ich >= 22 && temCod;
    let ntam = 6.75;
    if (!vazio(nome)) {
      let linhas = quebrar(nome, nw, ntam, "bold"); const maxL = ich >= 27 ? 2 : 1;
      while ((linhas.length > maxL || linhas.some(l => largura(l, ntam, "bold") > nw)) && ntam > 6) { ntam -= 0.25; linhas = quebrar(nome, nw, ntam, "bold"); }
      const [ls, ct] = quebrarEm(nome, nw, ntam, maxL, "bold");
      if (ct) aviso('Ferramentas e materiais: o nome "' + nome + '" não coube inteiro; encurte.');
      const lead = ntam * 1.18, bloco = ls.length * lead + (linhaCod ? 8 : 0);
      pg.paragrafo(nx, cy_ - ich / 2 + bloco / 2 - ntam * 0.85, ls, ntam, TINTA, "bold", null, nw, lead);
    }
    if (linhaCod) {
      const yc = !vazio(nome) ? cy_ - ich / 2 - (quebrar(nome, nw, ntam, "bold").slice(0, 2).length * ntam * 1.18) / 2 - 4 : cy_ - ich + 8;
      pg.texto(nx, yc, "Cód. SAP " + it.codigo, 5.6, CINZA);
    }
  });

  const b4h = 30, b4y = M;
  blocoObservar(pg, d, aviso);

  // ---------------- 3 . execução ----------------
  const etapas = d.etapas || [], n = Math.max(1, etapas.length);
  const y3 = secao(pg, y - bh - 9, 3, "EXECUÇÃO", etapas.length + (etapas.length === 1 ? " etapa" : " etapas"));
  const b3 = b4y + b4h + 8, gap = n <= 6 ? 9 : 6, cw = (W - 2 * M - (n - 1) * gap) / n;
  if (cw < CARTAO_MIN) aviso("Execução: " + n + " etapas deixam cada cartão com " + (cw / 28.35).toFixed(1).replace(".", ",") + " cm; junte etapas ou divida em duas instruções de trabalho.");
  const tt = Math.max(8, Math.min(10.5, cw / 14));
  let cs = Math.max(MIN_TXT, Math.min(8, 6 + cw / 70)), ks = Math.max(6.5, cs - 0.6);
  const inner = cw - 14, rotK = "Ponto-chave:";
  let rk = largura(rotK + " ", ks, "bold");
  const MAX_COMO = 4, MAX_CHAVE = 3;
  const linhasComo = tam => Math.min(MAX_COMO, Math.max(0, ...etapas.filter(e => !vazio(e.como)).map(e => quebrar(e.como, inner, tam).length)));
  const linhasChave = (tam, rec) => Math.min(MAX_CHAVE, Math.max(0, ...etapas.filter(e => !vazio(e.chave)).map(e => quebrar(e.chave, inner - 9, tam, null, rec).length)));
  let lComo = linhasComo(cs);
  while (lComo > 2 && cs > MIN_TXT) { cs = Math.max(MIN_TXT, cs - 0.25); lComo = linhasComo(cs); }
  const leadC = cs * 1.32;
  let lChave = linhasChave(ks, rk);
  while (lChave > 2 && ks > 6.5) { ks = Math.max(6.5, ks - 0.25); rk = largura(rotK + " ", ks, "bold"); lChave = linhasChave(ks, rk); }
  const leadK = ks * 1.28, comoH = lComo * leadC, chaveH = lChave ? lChave * leadK + 7 : 0, hh = 25.5;
  const fotoY = b3 + 7 + chaveH + (chaveH ? 5 : 0) + comoH + 5, fotoH = (y3 - hh - 7) - fotoY;
  if (etapas.length && fotoH < FOTO_MIN) aviso("Execução: fotos com " + (fotoH / 28.35).toFixed(1).replace(".", ",") + " cm de altura; encurte os textos ou junte etapas.");
  etapas.forEach((e, i) => {
    const x = M + i * (cw + gap);
    pg.caixa(x, b3, cw, y3 - b3, 6, "white");
    pg.caixa(x, y3 - hh, cw, hh, 6, FUNDO);
    pg.ret(x, y3 - hh, cw, 6, FUNDO);
    pg.caixa(x, b3, cw, y3 - b3, 6, null, LINHA, 0.75);
    const bs = cw >= 110 ? 16.5 : 14;
    pg.caixa(x + 7, y3 - hh / 2 - bs / 2, bs, bs, 4.5, AZUL);
    pg.texto(x + 7 + bs / 2, y3 - hh / 2 - 2.8, String(i + 1).padStart(2, "0"), bs > 15 ? 7.9 : 7, "white", "bold", null, "center");
    const tx = x + 7 + bs + 6;
    if (!vazio(e.titulo)) {
      const [et, eTam, ct] = caber(e.titulo, tt, cw - (tx - x) - 6, 7, "bold");
      if (ct) aviso("Execução: título da etapa " + (i + 1) + " longo demais; use um verbo.");
      pg.texto(tx, y3 - hh / 2 - 3.6, et, eTam, AZUL, "bold");
    }
    const fx_ = x + 7;
    pg.foto(e.foto, fx_, fotoY, inner, fotoH, "ajustar", 4.5);
    if (!vazio(e.como)) {
      const [ls, ct] = quebrarEm(e.como, inner, cs, MAX_COMO);
      if (ct) aviso('Execução: o "como fazer" da etapa ' + (i + 1) + " ficou longo demais; encurte.");
      pg.paragrafo(fx_, fotoY - 5 - cs * 0.92, ls, cs, TINTA, null, null, inner, leadC);
    }
    if (!vazio(e.chave)) {
      const kb = b3 + 7;
      pg.caixa(fx_, kb, inner, chaveH, 3, FUNDO);
      pg.caixa(fx_, kb, 2.25, chaveH, 1.1, AZUL);
      const [ls, ct] = quebrarEm(e.chave, inner - 9, ks, MAX_CHAVE, null, rk);
      if (ct) aviso("Execução: o ponto-chave da etapa " + (i + 1) + " ficou longo demais; encurte.");
      pg.paragrafo(fx_ + 6, kb + chaveH - 3.5 - ks * 0.92, ls, ks, TINTA, null, null, inner - 9, leadK, rotK, TINTA, rk);
    }
  });
  return avisos.sort();
}

/* ======================================================================
   MODELO COMPLETO (várias páginas): identificação, ferramentas e materiais,
   desenhos e referências, execução e validação. Mesmo cabeçalho em todas as páginas.
   ====================================================================== */
const FAIXA_MINUTA = "MINUTA PARA VALIDAÇÃO TÉCNICA E DE SEGURANÇA";

// QR code: só o espaço; o QR é inserido depois
Pagina.prototype.qrVazio = function (x, y, lado) {
  this.caixa(x, y, lado, lado, 3, "white", "#93A3AA", 0.75, true);
  this.texto(x + lado / 2, y + lado / 2 + 1.5, "Inserir", 6.5, CINZA, "bold", null, "center");
  this.texto(x + lado / 2, y + lado / 2 - 6.5, "QR Code", 6.5, CINZA, "bold", null, "center");
};

// texto que quebra dentro de uma área e diminui até o mínimo para caber
function textoEmCaixa(pg, x, yTopo, larg, alt, s, tamMax, tamMin, peso, cor, aviso, rotAviso) {
  if (vazio(s) || alt <= 0) return;
  let tam = tamMax;
  for (;;) {
    const ls = quebrar(String(s), larg, tam, peso);
    if ((ls.length <= cabeLinhas(alt, tam, 1.25) && ls.every(l => largura(l, tam, peso) <= larg)) || tam <= tamMin) break;
    tam = Math.max(tamMin, tam - 0.25);
  }
  const [ls, ct] = quebrarEm(String(s), larg, tam, Math.max(1, cabeLinhas(alt, tam, 1.25)), peso);
  if (ct && aviso && rotAviso) aviso(rotAviso);
  pg.paragrafo(x, yTopo - 0.92 * tam, ls, tam, cor || TINTA, peso, null, larg, 1.25 * tam);
}

// linha de quadros (rótulo + valor) com o mesmo tamanho de letra em todos
function quadros(pg, x, yTopo, w, h, campos, pesos, tamMax, aviso) {
  const gap = 6, n = campos.length;
  if (!n) return;
  pesos = pesos || campos.map(() => 1);
  const soma = pesos.reduce((a, b) => a + b, 0), livre = w - (n - 1) * gap;
  const larg = pesos.map(p => livre * p / soma), altValor = h - 18 - 3;
  const cabe = tam => campos.every((c, i) => {
    if (vazio(c[1])) return true;
    const ls = quebrar(String(c[1]), larg[i] - 14, tam, "bold");
    return ls.length <= cabeLinhas(altValor, tam) && ls.every(l => largura(l, tam, "bold") <= larg[i] - 14);
  });
  let vt = tamMax;
  while (vt > MIN_TXT && !cabe(vt)) vt = Math.max(MIN_TXT, vt - 0.25);
  let cx = x;
  campos.forEach((c, i) => {
    const cw = larg[i], vw = cw - 14;
    pg.caixa(cx, yTopo - h, cw, h, 4.5, FUNDO, LINHA, 0.75);
    const rt = ajustar(c[0], 6, vw, MIN_ROT, "bold");
    pg.texto(cx + 7, yTopo - 11, encurtar(c[0], rt, vw, "bold"), rt, CINZA, "bold");
    if (!vazio(c[1])) {
      const [ls, ct] = quebrarEm(String(c[1]), vw, vt, Math.max(1, cabeLinhas(altValor, vt)), "bold");
      if (ct && aviso) aviso('Identificação: o valor de "' + c[0] + '" não coube inteiro; encurte.');
      pg.paragrafo(cx + 7, yTopo - 18 - 0.74 * vt, ls, vt, TINTA, "bold", null, vw, 1.15 * vt);
    }
    cx += cw + gap;
  });
}

function cabecalhoCompleto(pg, d, sub, num, total, aviso) {
  const top = H - M, hb = 44;
  pg.caixa(M, top - hb, W - 2 * M, hb, 4.5, AZUL);
  const lh = 29, lw = lh * LOGO.w / LOGO.h;
  pg.imagem(LOGO, M + 13.5, top - hb + (hb - lh) / 2, lw, lh, "exato", 0);
  const xd = M + 13.5 + lw + 12;
  pg.linha(xd, top - hb + 9, xd, top - 9, AZUL_LINHA);
  const xt = xd + 12; let xr = W - M - 4.5;
  for (const [rot, val] of [["DATA", d.data], ["REVISÃO", d.revisao], ["DOCUMENTO", d.documento]]) {
    const tv = vazio(val) ? "" : String(val);
    const bw = Math.max(largura(tv, 9.75, "bold"), largura(rot, 6, "bold")) + 21, xl = xr - bw;
    pg.linha(xl, top - hb + 9, xl, top - 9, AZUL_LINHA);
    pg.texto(xl + 9, top - 17, rot, 6, AZUL_ROT, "bold");
    if (tv) pg.texto(xl + 9, top - 31, tv, 9.75, "white", "bold");
    xr = xl;
  }
  const nome = !vazio(d.titulo) ? String(d.titulo).trim().toUpperCase() : (vazio(d.tipo) ? "" : String(d.tipo));
  if (nome) {
    const [t, tt, ct] = caber(nome, 13.5, xr - 14 - xt, 9, "bold");
    if (ct) aviso("Cabeçalho: título da atividade longo demais; encurte.");
    pg.texto(xt, top - 21, t, tt, "white", "bold");
  }
  const mq = vazio(d.maquina) ? "" : (/^\d/.test(String(d.maquina).trim()) ? "Máquina " : "") + String(d.maquina).trim();
  const [s2, st] = caber((mq ? mq + " / " : "") + sub, 9, xr - 14 - xt, MIN_TXT);
  pg.texto(xt, top - 35, s2, st, AZUL_SUB);
  pg.gradiente(M, top - hb - 8, W - 2 * M, 3);
  pg.texto(M, top - hb - 21, FAIXA_MINUTA, 7.2, VERMELHO, "bold");
  pg.texto(W - M, top - hb - 21, "Página " + num + " de " + total, 7.2, CINZA, null, null, "right");
  return top - hb - 30;
}

function listaRiscos(pg, x, yTopo, larg, alt, riscos, aviso) {
  riscos = (riscos || []).filter(t => !vazio(t));
  if (!riscos.length) return;
  const tenta = (cols, tam) => {
    const colw = larg / cols, lead = tam * 1.25, porCol = Math.ceil(riscos.length / cols), blocos = [];
    for (const t of riscos) {
      const ls = quebrar(String(t), colw - 10, tam);
      if (ls.some(l => largura(l, tam) > colw - 10)) return null;
      blocos.push(ls);
    }
    for (let c = 0; c < cols; c++) {
      const bl = blocos.slice(c * porCol, (c + 1) * porCol);
      if (bl.reduce((s, b) => s + b.length, 0) * lead + Math.max(0, bl.length - 1) * 1.6 > alt) return null;
    }
    return {colw, lead, porCol, blocos, tam};
  };
  let lay = null;
  for (const tam of [7.6, 7.3, 7, 6.7, 6.4, 6.1]) { for (const c of [1, 2, 3]) { lay = tenta(c, tam); if (lay) break; } if (lay) break; }
  if (!lay) {
    const tam = 6.1, cols = riscos.length > 3 ? 2 : 1, colw = larg / cols, porCol = Math.ceil(riscos.length / cols);
    lay = {colw, lead: Math.min(tam * 1.25, alt / porCol), porCol, tam, blocos: riscos.map(t => [encurtar(t, tam, colw - 10)])};
    aviso("Riscos: textos longos ou muitos itens para o espaço; deixe os principais e remeta à APR.");
  }
  for (let c = 0; c * lay.porCol < riscos.length; c++) {
    const bx = x + c * lay.colw; let by = yTopo - lay.tam * 0.92;
    for (const ls of lay.blocos.slice(c * lay.porCol, (c + 1) * lay.porCol)) {
      pg.circulo(bx + 1.5, by + 2.2, 1.4, AMARELO);
      pg.paragrafo(bx + 7, by, ls, lay.tam, TINTA, null, null, lay.colw - 10, lay.lead);
      by -= ls.length * lay.lead + 1.6;
    }
  }
}

function blocoCondicao(pg, x, yTopo, w, h, d, aviso) {
  pg.caixa(x, yTopo - h, w, h, 6, AMARELO_BG);
  pg.caixa(x, yTopo - h, 3, h, 1.5, AMARELO);
  pg.texto(x + 12, yTopo - 13, "CONDIÇÃO SEGURA", 7.1, AMARELO_TX, "bold");
  pg.texto(x + 12, yTopo - 26, "Condição:", 7.1, TINTA, "bold");
  let cx = x + 12 + largura("Condição:", 7.1, "bold") + 8;
  for (const [chave, t] of [["parado", "Parado, com bloqueio"], ["operacao", "Em operação"]]) {
    pg.marcador(cx, yTopo - 27.5, d.condicao === chave);
    pg.texto(cx + 10, yTopo - 26, t, 7.1);
    cx += 10 + largura(t, 7.1) + 12;
  }
  pg.texto(x + 12, yTopo - 39, "Riscos", 7.1, TINTA, "bold");
  pg.texto(x + 12 + largura("Riscos ", 7.1, "bold"), yTopo - 39, "(conferir na APR da área)", 6.4, CINZA);
  listaRiscos(pg, x + 13, yTopo - 46, w - 24, h - 51, d.riscos, aviso);
}

// cartão de ferramenta, material ou EPI: foto grande em cima (ou ao lado, se o cartão for baixo)
function cartaoItem(pg, x, yTopo, w, h, it, aviso, o) {
  o = o || {};
  const pad = 6, modo = o.modo || "ajustar";
  pg.caixa(x, yTopo - h, w, h, 6, o.fundo || "white", o.fundo ? null : LINHA, 0.75);
  const nome = vazio(it.nome) ? "" : String(it.nome).trim(), temCod = !vazio(it.codigo);
  if (h >= 110) {
    const ph = h - pad - 46, nw = w - 2 * pad - 4;
    pg.foto(it.foto, x + pad, yTopo - pad - ph, w - 2 * pad, ph, modo, 4.5, o.fundo ? "white" : null);
    if (nome) {
      let tam = 8.5, ls = quebrar(nome, nw, tam, "bold");
      while ((ls.length > 2 || ls.some(l => largura(l, tam, "bold") > nw)) && tam > 6.75) { tam -= 0.25; ls = quebrar(nome, nw, tam, "bold"); }
      const [lf, ct] = quebrarEm(nome, nw, tam, 2, "bold");
      if (ct) aviso((o.rot || "Ferramentas e materiais") + ': o nome "' + nome + '" não coube inteiro; encurte.');
      pg.paragrafo(x + pad + 2, yTopo - pad - ph - 7 - 0.92 * tam, lf, tam, o.cor || AZUL, "bold", null, nw, 1.18 * tam);
    }
    if (temCod) pg.texto(x + pad + 2, yTopo - h + 9, "SAP " + it.codigo, 7, CINZA, "bold");
  } else {
    const ps = h - 2 * pad, pw = Math.min(ps * 1.3, w * 0.42), nx = x + pad + pw + 7, nw = x + w - pad - nx;
    pg.foto(it.foto, x + pad, yTopo - h + pad, pw, ps, modo, 4, o.fundo ? "white" : null);
    if (nome) {
      let tam = 7.5, ls = quebrar(nome, nw, tam, "bold");
      while ((ls.length > 2 || ls.some(l => largura(l, tam, "bold") > nw)) && tam > 6) { tam -= 0.25; ls = quebrar(nome, nw, tam, "bold"); }
      const [lf, ct] = quebrarEm(nome, nw, tam, 2, "bold");
      if (ct) aviso((o.rot || "Ferramentas e materiais") + ': o nome "' + nome + '" não coube inteiro; encurte.');
      const bloco = lf.length * tam * 1.15 + (temCod ? 9 : 0);
      pg.paragrafo(nx, yTopo - h / 2 + bloco / 2 - 0.92 * tam, lf, tam, o.cor || AZUL, "bold", null, nw, 1.15 * tam);
      if (temCod) pg.texto(nx, yTopo - h / 2 - bloco / 2 + 1.5, encurtar("SAP " + it.codigo, 6.2, nw), 6.2, CINZA);
    } else if (temCod) pg.texto(nx, yTopo - h / 2 - 2, encurtar("SAP " + it.codigo, 6.2, nw), 6.2, CINZA);
  }
}

// "Ponto-chave" no pé do cartão da etapa; devolve a altura (desenha só se pedido)
function blocoChave(pg, x, yBase, w, chave, desenhar) {
  if (vazio(chave)) return 0;
  const tam = 7.5, rk = largura("Ponto-chave: ", tam, "bold"), lead = tam * 1.28;
  const [ls] = quebrarEm(String(chave), w - 10, tam, 4, null, rk);
  const h = ls.length * lead + 9;
  if (desenhar) {
    pg.caixa(x, yBase, w, h, 3, FUNDO);
    pg.caixa(x, yBase, 2.25, h, 1.1, AZUL);
    pg.paragrafo(x + 6, yBase + h - 4.5 - 0.92 * tam, ls, tam, TINTA, null, null, w - 10, lead, "Ponto-chave:", TINTA, rk);
  }
  return h;
}

function cartaoEtapa(pg, x, yTopo, cw, ch, e, i, aviso) {
  const hh = 24;
  pg.caixa(x, yTopo - ch, cw, ch, 6, "white");
  pg.caixa(x, yTopo - hh, cw, hh, 6, FUNDO);
  pg.ret(x, yTopo - hh, cw, 6, FUNDO);
  pg.caixa(x, yTopo - ch, cw, ch, 6, null, LINHA, 0.75);
  const bs = 16;
  pg.caixa(x + 7, yTopo - hh / 2 - bs / 2, bs, bs, 4, AZUL);
  pg.texto(x + 7 + bs / 2, yTopo - hh / 2 - 2.8, String(i + 1).padStart(2, "0"), 7.6, "white", "bold", null, "center");
  const tx = x + 7 + bs + 7;
  if (!vazio(e.titulo)) {
    const [et, eTam, ct] = caber(e.titulo, 10, cw - (tx - x) - 7, 7.5, "bold");
    if (ct) aviso("Execução: título da etapa " + (i + 1) + " longo demais; use um verbo.");

// quais páginas o documento terá
function planoCompleto(d) {
  const pags = [{t: "ident", sub: "Identificação e preparação"}];
  const ok = it => !vazio(it.nome) || it.foto;
  const linhas = [], ferr = (d.itens || []).filter(ok), mats = (d.materiais || []).filter(ok);
  for (let i = 0; i < ferr.length; i += 5) linhas.push({tipo: "F", rot: "Ferramentas", titulo: i ? "FERRAMENTAS (CONTINUAÇÃO)" : "FERRAMENTAS", itens: ferr.slice(i, i + 5)});
  for (let i = 0; i < mats.length; i += 5) linhas.push({tipo: "M", rot: "Materiais", titulo: i ? "MATERIAIS E COMPONENTES (CONTINUAÇÃO)" : "MATERIAIS, COMPONENTES E CONSUMÍVEIS", itens: mats.slice(i, i + 5)});
  for (let i = 0; i < linhas.length; i += 2) {
    const ls = linhas.slice(i, i + 2), tipos = new Set(ls.map(l => l.tipo));
    pags.push({t: "itens", linhas: ls, sub: tipos.size > 1 ? "Ferramentas e materiais" : (tipos.has("F") ? "Ferramentas" : "Materiais e componentes")});
  }
  const imgs = (d.refs || []).filter(r => r.foto);
  if (imgs.length || !vazio(d.refsObs))
    for (let i = 0; i < Math.max(1, imgs.length); i += 2) pags.push({t: "refs", sub: "Referências técnicas", imgs: imgs.slice(i, i + 2), obs: i === 0 ? d.refsObs : ""});
  const et = d.etapas || [], dd = v => String(v).padStart(2, "0");
  if (!et.length) pags.push({t: "exec", sub: "Execução", etapas: [], ini: 0, total: 0});
  for (let i = 0; i < et.length; i += 6) {
    const b = Math.min(et.length, i + 6);
    pags.push({t: "exec", sub: et.length > 6 ? "Execução: etapas " + dd(i + 1) + " a " + dd(b) : "Execução", etapas: et.slice(i, b), ini: i, total: et.length});
  }
  pags.push({t: "valid", sub: "Validação do documento"});
  return pags;
}

function montarCompleto(novaPagina, d) {
  const avisos = [], aviso = t => { if (!avisos.includes(t)) avisos.push(t); };
  const plano = planoCompleto(d), desenha = {ident: paginaIdent, itens: paginaItens, refs: paginaRefs, exec: paginaExec, valid: paginaValid};
  const paginas = plano.map((p, i) => {
    const pg = novaPagina(), y0 = cabecalhoCompleto(pg, d, p.sub, i + 1, plano.length, aviso);
    desenha[p.t](pg, d, p, y0, aviso);
    return pg;
  });
  return {paginas, avisos: avisos.sort()};
}

// gera as páginas do modelo escolhido
function gerarPaginas(novaPagina, d) {
  if (d.modelo === "completo") return montarCompleto(novaPagina, d);
  const pg = novaPagina();
  return {paginas: [pg], avisos: montar(pg, d)};
}

  for (const c of d.campos) if (vazio(c[1])) p.push(c[0].charAt(0) + c[0].slice(1).toLowerCase());
  if (!d.foto_equipamento) p.push("Foto do equipamento");
  if (!d.riscos.some(t => !vazio(t))) p.push("Riscos");
  if (!d.itens.some(t => !vazio(t.nome))) p.push("Ferramentas e materiais");
  d.itens.forEach(it => { if (!vazio(it.nome) && !it.foto) p.push("Foto da ferramenta/material: " + it.nome); });
  d.epis.forEach(e => { if (!vazio(e.nome) && !e.foto) p.push("Foto do EPI: " + e.nome); });
  if (!d.etapas.length) p.push("Etapas da atividade");
  d.etapas.forEach((e, i) => {
    if (vazio(e.titulo)) p.push("Etapa " + (i + 1) + ": título");
    if (vazio(e.como)) p.push("Etapa " + (i + 1) + ": como fazer");
    if (!e.foto) p.push("Etapa " + (i + 1) + ": foto");
  });
  if (!d.observar.some(t => !vazio(t))) p.push("O que observar");
  if (d.modelo === "completo") {
    if (vazio(d.local)) p.push("Local da atividade");
    if (vazio(d.tag)) p.push("TAG");
    if (vazio(d.preparacao)) p.push("Preparação da área");
    d.materiais.forEach(m => { if (!vazio(m.nome) && !m.foto) p.push("Foto do material: " + m.nome); });
  }
  return p;
}

const BD = {

  async le(k) { try { const bd = await this.abre(); return await new Promise(ok => { const r = bd.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); }); } catch (e) { return undefined; } },
  async grava(k, v) { try { const bd = await this.abre(); await new Promise(ok => { const t = bd.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); } catch (e) { /* sem armazenamento: segue sem rascunho */ } }
};

document.addEventListener("click", ev => {

  else if (ac === "mais") getP(bt.dataset.p).push("");
  else if (ac === "maisepi") { E.episOutros.push({nome: "", codigo: "", foto: null}); E.somenteArea = false; }
  else if (ac === "maisitem") E.itens.push({nome: "", codigo: "", foto: null});

  else return;

/* ---------------------------------------------------------------- biblioteca de EPIs, ferramentas e materiais (galeria em tela cheia) */
const BIB_DIR = "bib/";
let _catalogo = null, GAL = null;
const _semAcento = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function bibRecentes() { try { return JSON.parse(localStorage.getItem("bibRecentes") || "[]"); } catch (e) { return []; } }
function bibGuardaRecentes(arqs) {
  try { localStorage.setItem("bibRecentes", JSON.stringify(arqs.concat(bibRecentes().filter(a => !arqs.includes(a))).slice(0, 15))); } catch (e) { /* sem memória local */ }
}
async function bibCatalogo() {
  if (!_catalogo) { const r = await fetch(BIB_DIR + "catalogo.json"); if (!r.ok) throw new Error("catálogo"); _catalogo = await r.json(); }
  return _catalogo;
}
function abrirGaleria(destino) {
  const tipos = destino === "episOutros" ? ["epi"] : destino === "materiais" ? ["mat", "ferr"] : ["ferr", "mat"];
  const titulo = destino === "episOutros" ? "Biblioteca de EPIs" : destino === "materiais" ? "Biblioteca de materiais" : "Biblioteca de ferramentas";
  GAL = {destino, tipos, titulo, aba: "", busca: "", sel: [], lista: []};
  let el = $("#gal"); if (!el) { el = document.createElement("div"); el.id = "gal"; el.className = "gal"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); document.body.appendChild(el); }
  el.setAttribute("aria-label", titulo);
  el.innerHTML = '<div class="gal-topo"><div class="gal-l1"><strong>' + h(titulo) + '</strong><button type="button" class="x" data-g="fechar" aria-label="Fechar">×</button></div>' +
    '<input type="search" id="galBusca" placeholder="Buscar (ex.: chave, luva, graxa)" autocomplete="off" aria-label="Buscar na biblioteca"><div class="gal-abas" id="galAbas"></div></div>' +
    '<div class="gal-corpo" id="galCorpo"><p class="gal-vazio">Abrindo a biblioteca…</p></div>' +
    '<div class="gal-rodape"><button type="button" class="btn sec" data-g="fechar">Cancelar</button><button type="button" class="btn" data-g="adicionar" id="galAdd" disabled>Adicionar</button></div>';
  el.hidden = false; document.documentElement.style.overflow = "hidden";
  try { if (!window.claude) history.pushState({gal: 1}, ""); } catch (e) { /* ok */ }
  bibCatalogo().then(cat => {
    if (!GAL) return;
    const ordem = t => GAL.tipos.indexOf(t);
    GAL.lista = cat.filter(x => GAL.tipos.includes(x.t)).sort((a, b) => ordem(a.t) - ordem(b.t));
    galDesenha(false);
  }).catch(() => { const c = $("#galCorpo"); if (c) c.innerHTML = '<p class="gal-vazio">Não consegui abrir a biblioteca. Ela precisa de internet na primeira vez; depois funciona sem.</p>'; });
}
function fecharGaleria(doHistorico) {
  const el = $("#gal"); if (el) { el.hidden = true; el.innerHTML = ""; }
  document.documentElement.style.overflow = ""; GAL = null;
  if (!doHistorico) { try { if (!window.claude && history.state && history.state.gal) history.back(); } catch (e) { /* ok */ } }
}
window.addEventListener("popstate", () => { if (GAL) fecharGaleria(true); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && GAL) fecharGaleria(false); });
function galJaTem() { return new Set((getP(GAL.destino) || []).map(x => _semAcento(x && x.nome).trim()).filter(Boolean)); }
function galCartao(x, ja) {
  const marcado = GAL.sel.includes(x.a), tem = ja.has(_semAcento(x.n));
  return '<button type="button" class="gal-it" data-g="item" data-a="' + h(x.a) + '" aria-pressed="' + marcado + '"' + (tem ? " disabled" : "") + '>' +
    '<img src="' + BIB_DIR + h(x.a) + '" alt="" loading="lazy" decoding="async" width="180" height="180"><span>' + h(x.n) + "</span>" + (tem ? "<small>já adicionado</small>" : "") + "</button>";
}
function galDesenha(soCorpo) {
  if (!GAL) return;
  const cats = []; GAL.lista.forEach(x => { if (!cats.includes(x.c)) cats.push(x.c); });
  const rec = bibRecentes().map(a => GAL.lista.find(x => x.a === a)).filter(Boolean);
  if (!soCorpo) {
    const abas = [["", "Todos"]].concat(rec.length ? [["*rec", "Recentes"]] : [], cats.map(c => [c, c]));
    $("#galAbas").innerHTML = abas.map(a => '<button type="button" data-g="aba" data-v="' + h(a[0]) + '" aria-pressed="' + (GAL.aba === a[0] && !GAL.busca) + '">' + h(a[1]) + "</button>").join("");
  } else document.querySelectorAll("#galAbas button").forEach(b => b.setAttribute("aria-pressed", String(!GAL.busca && b.dataset.v === GAL.aba)));
  const ja = galJaTem(), grade = l => '<div class="gal-grade">' + l.map(x => galCartao(x, ja)).join("") + "</div>";
  let html = "";
  if (GAL.busca.trim()) {
    const termos = _semAcento(GAL.busca).split(/\s+/).filter(Boolean);
    const l = GAL.lista.filter(x => { const t = _semAcento(x.n + " " + x.c); return termos.every(k => t.includes(k)); });
    html = l.length ? grade(l) : '<p class="gal-vazio">Nada encontrado. Use "+ … com foto própria" para cadastrar um item que não está na biblioteca.</p>';
  } else if (GAL.aba === "*rec") html = grade(rec);
  else if (GAL.aba) html = grade(GAL.lista.filter(x => x.c === GAL.aba));
  else html = (rec.length ? "<h4>Usados recentemente</h4>" + grade(rec.slice(0, 6)) : "") + cats.map(c => "<h4>" + h(c) + "</h4>" + grade(GAL.lista.filter(x => x.c === c))).join("");
  const corpo = $("#galCorpo"); corpo.innerHTML = html; corpo.scrollTop = 0;
  galRodape();
}
async function fotoDaBib(blob) {   // a foto da biblioteca já vem recortada e com fundo branco: usa como está
  const src = await new Promise((ok, erro) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = erro; f.readAsDataURL(blob); });
  const im = await carregaImg(src), W = im.naturalWidth, H = im.naturalHeight;
  try {   // tira a margem branca para a moldura ficar justa no objeto
    const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, W, H).data; let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const k = (y * W + x) * 4; if (d[k] < 235 || d[k + 1] < 235 || d[k + 2] < 235) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    if (x1 < 0) return {src, w: W, h: H};
    const m = Math.round(Math.max(x1 - x0, y1 - y0) * 0.06); x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
    const w = x1 - x0 + 1, h2 = y1 - y0 + 1, o = document.createElement("canvas"); o.width = w; o.height = h2;
    const go = o.getContext("2d"); go.fillStyle = "#fff"; go.fillRect(0, 0, w, h2); go.drawImage(im, x0, y0, w, h2, 0, 0, w, h2);
    return {src: o.toDataURL("image/jpeg", 0.85), w, h: h2};
  } catch (e) { return {src, w: W, h: H}; }
}
function galRodape() { const b = $("#galAdd"); if (!b) return; const n = GAL.sel.length; b.disabled = !n; b.textContent = n ? "Adicionar (" + n + ")" : "Adicionar"; }
async function galClique(bt) {
  const g = bt.dataset.g; if (!GAL) return;
  if (g === "fechar") return fecharGaleria(false);
  if (g === "aba") { GAL.aba = bt.dataset.v; GAL.busca = ""; const b = $("#galBusca"); if (b) b.value = ""; return galDesenha(true); }
  if (g === "item") {
    const a = bt.dataset.a, k = GAL.sel.indexOf(a); if (k >= 0) GAL.sel.splice(k, 1); else GAL.sel.push(a);
    document.querySelectorAll('.gal-it[data-a="' + a.replace(/"/g, "") + '"]').forEach(x => x.setAttribute("aria-pressed", String(k < 0)));
    return galRodape();
  }
  if (g === "adicionar") {
    const escolhidos = GAL.sel.map(a => GAL.lista.find(x => x.a === a)).filter(Boolean), destino = GAL.destino;
    bt.disabled = true; bt.textContent = "Adicionando…";
    const novos = [];
    try {
      for (const x of escolhidos) {
        const r = await fetch(BIB_DIR + x.a); if (!r.ok) throw new Error(x.n);
        novos.push({nome: x.n, codigo: "", foto: await fotoDaBib(await r.blob())});
      }
    } catch (e) { bt.disabled = false; galRodape(); msg("Não consegui baixar a foto de " + (e.message || "um item") + ". Confira a internet."); return; }
    const lista = getP(destino);
    for (let k = lista.length - 1; k >= 0; k--) { const o = lista[k]; if (o && vazio(o.nome) && vazio(o.codigo) && !o.foto) lista.splice(k, 1); }   // tira os itens em branco
    lista.push(...novos);
    if (destino === "episOutros" && novos.length) E.somenteArea = false;
    bibGuardaRecentes(escolhidos.map(x => x.a));
    fecharGaleria(false); desenha(false);
    msg(novos.length === 1 ? "1 item adicionado. Preencha o código SAP." : novos.length + " itens adicionados. Preencha os códigos SAP.");
  }
}

async function gerarBlob() {
  const d = fabricarDados(), falta = obrigatorios(d);
  if (falta.length) throw new Error("Falta: " + falta.join("; "));
  const loja = {midias: [], porChave: {}}, r = gerarPaginas(() => new PaginaPPTX(loja), d);
  return {blob: await salvarPptx(r.paginas, d.documento || "Instrução de trabalho"), nome: (d.documento || "InstrucaoDeTrabalho") + ".pptx"};
}
async function entregar(blob, nome) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
  if (dl) { await dl.save({filename: nome, data: blob}); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function gerar(bt) {
  const res = $("#resultado"); bt.disabled = true; const txt = bt.textContent; bt.textContent = "Gerando…";
  try {
    ultimoArquivo = await gerarBlob();
    await entregar(ultimoArquivo.blob, ultimoArquivo.nome);
    res.innerHTML = '<div class="aviso ok"><strong>Instrução de trabalho gerada</strong><span>' + h(ultimoArquivo.nome) + " (" + Math.round(ultimoArquivo.blob.size / 1024) + " KB). Veja na pasta Downloads do aparelho.</span></div>";
    const arq = new File([ultimoArquivo.blob], ultimoArquivo.nome, {type: ultimoArquivo.blob.type});
    if (navigator.canShare && navigator.canShare({files: [arq]})) $("#btComp").hidden = false;
  } catch (e) {
    const recusou = e && e.code === "declined";
    res.innerHTML = '<div class="aviso erro"><strong>' + (recusou ? "Download cancelado" : "Não foi possível gerar") + "</strong><span>" + h(recusou ? "Toque em Gerar de novo quando quiser salvar." : (e && e.message || e)) + "</span></div>";
  }
  bt.disabled = false; bt.textContent = txt;
}
async function compartilhar() {
  if (!ultimoArquivo) return;
  try { await navigator.share({files: [new File([ultimoArquivo.blob], ultimoArquivo.nome, {type: ultimoArquivo.blob.type})], title: ultimoArquivo.nome}); }
  catch (e) { if (!e || e.name !== "AbortError") msg("Este aparelho não deixou compartilhar. Use o arquivo da pasta Downloads."); }
}
